

services:
  db:
    image: postgres:15-alpine
    container_name: jdab_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgrespassword}
      POSTGRES_DB: jdab_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: jdab_backend
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${DB_PASSWORD:-postgrespassword}@db:5432/jdab_db
      SECRET_KEY: ${SECRET_KEY:?define SECRET_KEY en un archivo .env junto a docker-compose.yml}
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: jdab_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data: